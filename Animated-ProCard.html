<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Profile Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: linear-gradient(45deg, crimson, blue);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1{
            font-style: bold;
            font-size: 25px;
        }
        h2{
            font-style: bold;
            font-size: 15px;
            color: darkgray;
        }
        h3{
            font-style: bold;
            font-size: 18px;
        }
        h4{
            font-style: bold;
            font-size: 14px;
            color: darkgray;
        }
        .card{
            position: relative;
            background-color: #fff;
            width: 350px;
            height: 200px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            border-radius: 15px;
            transition: all 0.4s ease-in-out;
        }
        .card:hover{
            height: 450px;
        }
        .pb{
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translate(-50%, 0%);
            background-image: url('./279094.jpg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            height: 150px;
            width: 150px;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            transition: all 0.4s ease-in-out;
        }
        .card:hover .pb{
            height: 250px;
            width: 250px;
        }
        .info{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 125px 0px 10px 0px;
            transition: all 0.4s ease-in-out;
        }
        .card:hover .info{
            display: flex;
            padding: 230px 0px 10px 0px;            
        }
        .detail{
            position: relative;
            display: flex;
            opacity: 0;
            z-index: -10px;
            justify-content: space-between;
            padding: 10px 50px;
            transform: translateX(-20px);
            transition-duration: 0s, 0.2s, 0.2s;
            transition-timing-function: linear;
            transition-property: z-index,opacity,transform;
            transition-delay: 0.2s, 0s, 0s;
        }
        .col{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .buttons{
            position: relative;
            display: flex;
            opacity: 0;
            z-index: -10px;
            padding: 10px 50px;
            justify-content: space-between;
            transform: translateX(-20px);
            transition-duration: 0s, 0.2s, 0.2s;
            transition-timing-function: linear;
            transition-property: z-index,opacity,transform;
            transition-delay: 0.2s, 0s, 0s;
        }
        button{
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
        }
        #follow{
            background-color: crimson;
            border: 1px solid crimson;
            color: #fff;
            font-style: bold;
            transition: all 0.3s linear;
        }
        #follow:hover{
            background-color: rgba(252, 0, 50, 0.767);
        }
        #message{
            background-color: transparent;
            border: 1px solid grey;
            color: grey;
            font-style: bold;
            transition: all 0.3s linear;
        }
        #message:hover{
            color: #fff;
            background-color: darkgrey;
        }
        .card:hover .detail,
        .card:hover .buttons{
            opacity: 1;
            z-index: 0;
            transform: translateX(0px);
            transition-duration: 0s, 0.3s, 0.3s;
            transition-timing-function: linear;
            transition-property: z-index, opacity, transform;
            transition-delay: 0.2s, 0.2s;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pb"></div>
        <div class="info">
            <h1>Alina Smith</h1>
            <h2>Senior UI/UX Designer</h2>
        </div>
        <div class="detail">
            <div class="col">
                <h3>234</h3>
                <h4>Posts</h4>
            </div>
            <div class="col">
                <h3>120k</h3>
                <h4>Followers</h4>
            </div>
            <div class="col">
                <h3>43</h3>
                <h4>Following</h4>
            </div>
        </div>
        <div class="buttons">
            <button id="follow">Follow</button>
            <button id="message">Message</button>
        </div>
    </div>
</body>
</html>
